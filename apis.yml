aid: goopti
name: GoOpti
description: >-
  GoOpti is a European ground-transportation marketplace for affordable airport
  transfers and intercity rides, connecting travelers with a network of vetted,
  contractual transport partners. Founded in Slovenia, GoOpti offers both shared
  (door-to-door pooled) and private transfers across Central and Southern Europe,
  using dynamic pricing where earlier, more flexible bookings earn lower fares.
  The company operates as a platform intermediary rather than a fleet owner, and
  has served more than two million passengers. Alongside its consumer booking
  site it runs B2B partner programs for agencies and resellers, corporate business
  accounts, franchising, and affiliates. GoOpti is a portfolio company of
  Point Nine and is tracked in the API Evangelist network. No public developer
  API, SDK, or agent-facing surface has been identified at this time.
